name: Build Unsloth llama-server

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag in unslothai/llama.cpp (empty = latest)"
        required: false
        default: ""
      cuda_version:
        description: "CUDA toolkit version (e.g. 13.5.0, 13.1.1, 13.0.2)"
        required: false
        default: "13.5.0"

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      base: ${{ steps.check.outputs.base }}
      repo_lc: ${{ steps.check.outputs.repo_lc }}
      cuda_version: ${{ steps.check.outputs.cuda_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new Unsloth release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          CUDA_VER="${{ github.event.inputs.cuda_version || '13.5.0' }}"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "cuda_version=${CUDA_VER}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ github.event.inputs.ref }}" ]; then
            TAG="${{ github.event.inputs.ref }}"
          else
            TAG=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/unslothai/llama.cpp/releases?per_page=1" | jq -r '.[0].tag_name')
          fi
          BASE="${TAG%%-mix-*}"
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for VARIANT in server server-cuda13 server-cuda13-sm89 server-rocm server-vulkan; do
            if ! docker manifest inspect "ghcr.io/${REPO_LC}:${VARIANT}-${TAG}" > /dev/null 2>&1; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "should_build=false" >> "$GITHUB_OUTPUT"

  prepare-source:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone upstream base and Unsloth pin scripts
        run: |
          git clone --no-checkout https://github.com/ggml-org/llama.cpp.git src
          git -C src checkout "${{ needs.check-release.outputs.base }}"
          git clone --depth 1 --branch "${{ needs.check-release.outputs.ref }}" \
            https://github.com/unslothai/llama.cpp.git unsloth

      - name: Apply Unsloth pr-set.json pins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          from pathlib import Path

          src = Path("src").resolve()
          additive = Path("unsloth/scripts/unsloth/additive_merge.py").resolve()
          pr_set = json.loads(Path("unsloth/scripts/unsloth/pr-set.json").read_text())

          def run(cmd, check=True):
              return subprocess.run(cmd, cwd=src, check=check)

          run(["git", "config", "user.name", "unsloth-builder"])
          run(["git", "config", "user.email", "builder@localhost"])
          run(["git", "config", "merge.conflictStyle", "diff3"])

          pat = re.compile(r"https://github\.com/([^/]+/[^/]+)/pull/(\d+)/commits/([0-9a-f]+)")
          token = os.environ.get("GH_TOKEN", "")

          for entry in pr_set.get("prs", []):
              url = entry["url"] if isinstance(entry, dict) else entry
              required = entry.get("required", True) if isinstance(entry, dict) else True
              m = pat.match(url)
              if not m:
                  raise ValueError(f"Unrecognized pin URL: {url}")
              repo, pr_num, sha = m.groups()

              if not required:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/pulls/{pr_num}",
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
                  )
                  with urllib.request.urlopen(req) as resp:
                      if json.loads(resp.read())["state"] != "open":
                          print(f"Skipping closed optional pin {repo}#{pr_num}")
                          continue

              print(f"Merging {repo}#{pr_num} @ {sha[:9]} ...")
              run(["git", "fetch", "--no-tags", f"https://github.com/{repo}.git", sha])
              res = run(["git", "merge", "--no-edit", "--no-ff", sha], check=False)
              if res.returncode != 0:
                  print(f"Conflict on {repo}#{pr_num}, running additive_merge.py ...")
                  run(["python3", str(additive)], check=True)
                  run(["git", "add", "-A"])
                  run(["git", "commit", "--no-edit"])
          PY

      - name: Pack merged source tree
        run: tar -cf merged-src.tar -C src .

      - name: Upload merged source artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-src
          path: merged-src.tar
          retention-days: 1
          compression-level: 0

  build:
    needs: [check-release, prepare-source]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: server
            dockerfile: .devops/cpu.Dockerfile
            free_disk: false
            build_args: ""
          - tag: server-cuda13
            dockerfile: .devops/cuda.Dockerfile
            free_disk: true
            build_args: |
              CUDA_VERSION=${{ needs.check-release.outputs.cuda_version }}
              CUDA_DOCKER_ARCH=default
          - tag: server-cuda13-sm89
            dockerfile: .devops/cuda.Dockerfile
            free_disk: true
            build_args: |
              CUDA_VERSION=${{ needs.check-release.outputs.cuda_version }}
              CUDA_DOCKER_ARCH=89
          - tag: server-rocm
            dockerfile: .devops/rocm.Dockerfile
            free_disk: true
            build_args: ""
          - tag: server-vulkan
            dockerfile: .devops/vulkan.Dockerfile
            free_disk: false
            build_args: ""

    steps:
      - name: Free disk space (required for CUDA 13 / ROCm dev images)
        if: matrix.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Download merged source artifact
        uses: actions/download-artifact@v4
        with:
          name: merged-src

      - name: Unpack merged source
        run: |
          mkdir src
          tar -xf merged-src.tar -C src
          rm -f merged-src.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/${{ matrix.dockerfile }}
          target: server
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ needs.check-release.outputs.repo_lc }}:${{ matrix.tag }}
            ghcr.io/${{ needs.check-release.outputs.repo_lc }}:${{ matrix.tag }}-${{ needs.check-release.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

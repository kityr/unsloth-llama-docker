name: Build Unsloth llama-server

on:
  schedule:
    - cron: "0 */12 * * *" # check for new Unsloth releases twice daily
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit in unslothai/llama.cpp (leave empty for latest release)"
        required: false
        default: ""
      cuda_version:
        description: "CUDA toolkit version (e.g. 13.5.0, 13.1.1, 13.0.2)"
        required: false
        default: "13.5.0"
      cuda_arch:
        description: "CUDA_DOCKER_ARCH ('default' for all GPUs, or e.g. '89' for Ada)"
        required: false
        default: "default"

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.get_ref.outputs.ref }}
    steps:
      - name: Resolve target ref
        id: get_ref
        run: |
          if [ -n "${{ github.event.inputs.ref }}" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(curl -fsSL https://api.github.com/repos/unslothai/llama.cpp/releases/latest | jq -r .tag_name)
            echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: server
            dockerfile: .devops/cpu.Dockerfile
            cuda_version: ""
          - tag: server-cuda13
            dockerfile: .devops/cuda.Dockerfile
            cuda_version: ${{ github.event.inputs.cuda_version || '13.5.0' }}

    steps:
      - name: Free disk space (required for CUDA 13 devel image)
        if: matrix.tag == 'server-cuda13'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Checkout unslothai/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: unslothai/llama.cpp
          ref: ${{ needs.resolve-ref.outputs.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: server
          push: true
          build-args: |
            CUDA_VERSION=${{ matrix.cuda_version }}
            CUDA_DOCKER_ARCH=${{ github.event.inputs.cuda_arch || 'default' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ needs.resolve-ref.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

name: Build Unsloth llama-server

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag in unslothai/llama.cpp (empty = latest)"
        required: false
        default: ""
      cuda_version:
        description: "CUDA toolkit version (e.g. 13.5.0, 13.1.1, 13.0.2)"
        required: false
        default: "13.5.0"

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      repo_lc: ${{ steps.check.outputs.repo_lc }}
      cuda_version: ${{ steps.check.outputs.cuda_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new Unsloth release
        id: check
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          CUDA_VER="${{ github.event.inputs.cuda_version || '13.5.0' }}"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "cuda_version=${CUDA_VER}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ github.event.inputs.ref }}" ]; then
            TAG="${{ github.event.inputs.ref }}"
          else
            TAG=$(curl -fsSL "https://api.github.com/repos/unslothai/llama.cpp/releases?per_page=1" | jq -r '.[0].tag_name')
          fi
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for VARIANT in server server-cuda13 server-cuda13-sm89 server-rocm server-vulkan; do
            if ! docker manifest inspect "ghcr.io/${REPO_LC}:${VARIANT}-${TAG}" > /dev/null 2>&1; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "should_build=false" >> "$GITHUB_OUTPUT"

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: server
            dockerfile: .devops/cpu.Dockerfile
            free_disk: false
            build_args: ""
          - tag: server-cuda13
            dockerfile: .devops/cuda.Dockerfile
            free_disk: true
            build_args: |
              CUDA_VERSION=${{ needs.check-release.outputs.cuda_version }}
              CUDA_DOCKER_ARCH=default
          - tag: server-cuda13-sm89
            dockerfile: .devops/cuda.Dockerfile
            free_disk: true
            build_args: |
              CUDA_VERSION=${{ needs.check-release.outputs.cuda_version }}
              CUDA_DOCKER_ARCH=89
          - tag: server-rocm
            dockerfile: .devops/rocm.Dockerfile
            free_disk: true
            build_args: ""
          - tag: server-vulkan
            dockerfile: .devops/vulkan.Dockerfile
            free_disk: false
            build_args: ""

    steps:
      - name: Free disk space (required for CUDA 13 / ROCm dev images)
        if: matrix.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Fetch Unsloth merged source tree
        run: |
          TAG="${{ needs.check-release.outputs.ref }}"
          SRC_URL=$(curl -fsSL "https://api.github.com/repos/unslothai/llama.cpp/releases/tags/${TAG}" \
            | jq -r '.assets[] | select(.name | test("^source.*\\.tar\\.gz$")) | .browser_download_url' \
            | head -n1)
          test -n "$SRC_URL"
          curl -fsSL "$SRC_URL" -o source.tar.gz
          tar -xzf source.tar.gz --strip-components=1
          rm -f source.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: server
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ needs.check-release.outputs.repo_lc }}:${{ matrix.tag }}
            ghcr.io/${{ needs.check-release.outputs.repo_lc }}:${{ matrix.tag }}-${{ needs.check-release.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

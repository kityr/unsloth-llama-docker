name: Build Unsloth llama-server

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit in unslothai/llama.cpp (empty = latest release)"
        required: false
        default: ""
      cuda_version:
        description: "CUDA toolkit version (e.g. 13.5.0, 13.1.1, 13.0.2)"
        required: false
        default: "13.5.0"
      cuda_arch:
        description: "CUDA_DOCKER_ARCH ('default' for all GPUs, or e.g. '89' for Ada)"
        required: false
        default: "default"

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      repo_lc: ${{ steps.check.outputs.repo_lc }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new Unsloth release
        id: check
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ github.event.inputs.ref }}" ]; then
            TAG="${{ github.event.inputs.ref }}"
          else
            TAG=$(curl -fsSL https://api.github.com/repos/unslothai/llama.cpp/releases/latest | jq -r .tag_name)
          fi
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "ghcr.io/${REPO_LC}:server-cuda13-${TAG}" > /dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: server
            dockerfile: .devops/cpu.Dockerfile
            cuda_version: ""
          - tag: server-cuda13
            dockerfile: .devops/cuda.Dockerfile
            cuda_version: ${{ github.event.inputs.cuda_version || '13.5.0' }}

    steps:
      - name: Free disk space (required for CUDA 13 devel image)
        if: matrix.tag == 'server-cuda13'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force

      - name: Checkout unslothai/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: unslothai/llama.cpp
          ref: ${{ needs.check-release.outputs.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: server
          push: true
          build-args: |
            CUDA_VERSION=${{ matrix.cuda_version }}
            CUDA_DOCKER_ARCH=${{ github.event.inputs.cuda_arch || 'default' }}
          tags: |
            ghcr.io/${{ needs.check-release.outputs.repo_lc }}:${{ matrix.tag }}
            ghcr.io/${{ needs.check-release.outputs.repo_lc }}:${{ matrix.tag }}-${{ needs.check-release.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

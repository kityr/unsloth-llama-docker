name: Build Unsloth llama-server

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag in unslothai/llama.cpp (empty = latest)"
        required: false
        default: ""

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      ref: ${{ steps.check.outputs.ref }}
      repo_lc: ${{ steps.check.outputs.repo_lc }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for new Unsloth release
        id: check
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ github.event.inputs.ref }}" ]; then
            TAG="${{ github.event.inputs.ref }}"
          else
            TAG=$(curl -fsSL "https://api.github.com/repos/unslothai/llama.cpp/releases?per_page=1" | jq -r '.[0].tag_name')
          fi
          echo "ref=${TAG}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "ghcr.io/${REPO_LC}:server-cuda13-${TAG}" > /dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: server
            asset_regex: "linux-x64-cpu.*\\.tar\\.gz$"
          - tag: server-cuda13
            asset_regex: "linux-x64-cuda13-portable\\.tar\\.gz$"

    steps:
      - name: Download and extract Unsloth prebuilt
        run: |
          TAG="${{ needs.check-release.outputs.ref }}"
          URL=$(curl -fsSL "https://api.github.com/repos/unslothai/llama.cpp/releases/tags/${TAG}" \
            | jq -r --arg re "${{ matrix.asset_regex }}" '.assets[] | select(.name | test($re)) | .browser_download_url' \
            | head -n1)
          test -n "$URL"
          curl -fsSL "$URL" -o bundle.tar.gz
          mkdir -p unpack app
          tar -xzf bundle.tar.gz -C unpack
          BIN_DIR=$(dirname "$(find unpack -name llama-server -type f | head -n1)")
          cp -a "${BIN_DIR}/." app/
          chmod +x app/llama-server

      - name: Write Dockerfile
        run: |
          cat <<'EOF' > Dockerfile
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends libgomp1 ca-certificates && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY app/ /app/
          ENV LD_LIBRARY_PATH=/app LLAMA_ARG_HOST=0.0.0.0 LLAMA_ARG_PORT=8080
          EXPOSE 8080
          ENTRYPOINT ["/app/llama-server"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.check-release.outputs.repo_lc }}:${{ matrix.tag }}
            ghcr.io/${{ needs.check-release.outputs.repo_lc }}:${{ matrix.tag }}-${{ needs.check-release.outputs.ref }}
